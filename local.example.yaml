# The machine paths this repository's scripts need. Copy this file to local.yaml (git-ignored) and fill in the
# values; no tracked file carries a machine path. Flat "key: value" lines; quote a value with single quotes; an empty
# value counts as not set. The generator writes local.yaml with the reference's keys filled in.

# The installed VST3 of the reference plug-in (the shell file for a plug-in inside a shell), for nulltest/
ref_vst3: ''
# The name a host shows for the reference ("Name@uid" for a plug-in inside a shell)
ref_name: ''
# Every further plug-in of the suite: the same two keys with its id in front, for example ThePlugin.ref_vst3

# The Python interpreter with the packages of requirements.txt (the check scripts default to python or python3)
python: ''
# The interpreter of the CUDA virtual environment, for training the learned blocks only
gpu_python: ''
# The folder of prebuilt host tools: ParamDump, RefRender, RefCapture, FocusCheck
tools_dir: ''
# The FL Studio executable, for renders inside the DAW
fl_exe: ''
# This repository's own copy of JUCE at the commit CMakeLists.txt pins, used instead of a download
# (FETCHCONTENT_SOURCE_DIR_JUCE). The configure step checks the commit and patches the copy in place
# (cmake/PatchJuceVst3Keys.cmake), so it is never another project's checkout. Empty: build/_deps/juce-src when a copy
# is there.
juce_src: ''
# This repository's own copy of clap-juce-extensions at the pinned commit, checked like JUCE
# (FETCHCONTENT_SOURCE_DIR_CLAP_JUCE_EXTENSIONS). Empty: build/_deps/clap_juce_extensions-src when a copy is there.
clap_src: ''
# The pluginval 1.0.4 executable
pluginval: ''
# The Inno Setup 7 compiler (ISCC.exe), for the Windows installer
iscc: ''

# Suite keys: the keys this suite's own scripts read, below this line. sync_template.py replaces everything above it
# with the starter's form and keeps this block as it is.
