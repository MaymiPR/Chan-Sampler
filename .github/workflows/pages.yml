# Landing page: the suite's page on GitHub Pages, generated from README.md, the plug-in pages and docs/ by
# scripts/make_site.py.
# Trigger: a published release, and by hand. Runner: ubuntu-24.04 (build, then deploy).
# Pages is enabled once in the repository's settings (Settings > Pages > Source: GitHub Actions); on the free plan
# that needs a public repository.
# Does not: say anything the README does not, or run before Pages is enabled.
name: Landing page

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Python Markdown
        run: python3 -m pip install --quiet markdown==3.7
      - name: Build the site
        env:
          REPO: ${{ github.repository }}
        run: python3 scripts/make_site.py --out site --repo "$REPO"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write           # only the deploy job publishes
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
