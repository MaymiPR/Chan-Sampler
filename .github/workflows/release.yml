# Builds Chan Sampler for Windows (VST3 + CLAP + Standalone), macOS (universal
# AU + VST3 + CLAP + Standalone app) and Linux (VST3 + CLAP + Standalone),
# validates the plugins, and makes the installers (Windows setup .exe, macOS
# .pkg) and a Linux tarball. Run it by hand from the Actions tab to get them
# as downloadable artifacts, or push a version tag (see CONTRIBUTING.md) to
# also publish them as a GitHub Release, with that version's notes from
# CHANGELOG.md and their SHA-256 checksums. Everyday builds and tests: ci.yml.
name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGINVAL: https://github.com/Tracktion/pluginval/releases/download/v1.0.4   # pinned: a new pluginval can fail an unchanged plugin

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -B build -A x64   # the newest Visual Studio on the runner

      - name: Build
        run: cmake --build build --config Release --target ChanSampler_VST3 ChanSampler_CLAP ChanSampler_Standalone --parallel

      - name: Validate the VST3 (pluginval, strictest level)
        shell: pwsh
        run: |
          Invoke-WebRequest $env:PLUGINVAL/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # pluginval is a GUI-subsystem program: wait for it and read its real exit code
          $plug = Resolve-Path "build/ChanSampler_artefacts/Release/VST3/Chan Sampler.vst3"
          $p = Start-Process -FilePath "pluginval/pluginval.exe" -NoNewWindow -Wait -PassThru `
                 -ArgumentList @("--strictness-level", "10", "--skip-gui-tests", "--timeout-ms", "900000", "--validate", "`"$plug`"")
          Write-Host "pluginval exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(ChanSampler VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$version" "packaging\ChanSampler.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: ChanSampler-Windows
          path: dist/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: "Configure (universal: Apple Silicon + Intel)"
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --target ChanSampler_AU ChanSampler_VST3 ChanSampler_CLAP ChanSampler_Standalone -- -quiet

      - name: Check universal binaries and sign (ad hoc)
        run: |
          set -e
          A=build/ChanSampler_artefacts/Release
          lipo -info "$A/AU/Chan Sampler.component/Contents/MacOS/Chan Sampler"
          lipo -info "$A/VST3/Chan Sampler.vst3/Contents/MacOS/Chan Sampler"
          lipo -info "$A/CLAP/Chan Sampler.clap/Contents/MacOS/Chan Sampler"
          # An ad hoc signature (no Apple developer account) is enough for
          # Apple Silicon to load the plugin once the download quarantine is removed.
          for b in "$A/AU/Chan Sampler.component" "$A/VST3/Chan Sampler.vst3" "$A/CLAP/Chan Sampler.clap" "$A/Standalone/Chan Sampler.app"; do
            codesign --force --deep --sign - "$b"
          done

      - name: Validate the AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/ChanSampler_artefacts/Release/AU/Chan Sampler.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Csm1 Chsm

      - name: Validate the AU and VST3 (pluginval, strictest level)
        run: |
          curl -sL -o pluginval.zip $PLUGINVAL/pluginval_macOS.zip
          unzip -q pluginval.zip
          P=pluginval.app/Contents/MacOS/pluginval
          $P --strictness-level 10 --skip-gui-tests --timeout-ms 900000 --validate ~/Library/Audio/Plug-Ins/Components/"Chan Sampler.component"
          $P --strictness-level 10 --skip-gui-tests --timeout-ms 900000 --validate "build/ChanSampler_artefacts/Release/VST3/Chan Sampler.vst3"

      - name: Installer (.pkg)
        run: |
          set -e
          V=$(sed -n 's/^project(ChanSampler VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          A=build/ChanSampler_artefacts/Release
          mkdir -p pkg/au pkg/vst3 pkg/clap pkg/app pkg/res dist
          cp -R "$A/AU/Chan Sampler.component" pkg/au/
          cp -R "$A/VST3/Chan Sampler.vst3" pkg/vst3/
          cp -R "$A/CLAP/Chan Sampler.clap" pkg/clap/
          cp -R "$A/Standalone/Chan Sampler.app" pkg/app/
          # Install exactly where stated (pkgbuild would otherwise follow a copy
          # of the bundle found elsewhere on the disk).
          for c in au vst3 clap app; do
            pkgbuild --analyze --root pkg/$c pkg/$c.plist
            n=$(plutil -extract @count raw pkg/$c.plist 2>/dev/null || echo 1)
            for ((i = 0; i < n; i++)); do plutil -replace $i.BundleIsRelocatable -bool NO pkg/$c.plist; done
          done
          pkgbuild --root pkg/au   --component-plist pkg/au.plist   --install-location "/Library/Audio/Plug-Ins/Components" --identifier com.chansampler.au   --version "$V" pkg/ChanSampler-AU.pkg
          pkgbuild --root pkg/vst3 --component-plist pkg/vst3.plist --install-location "/Library/Audio/Plug-Ins/VST3"       --identifier com.chansampler.vst3 --version "$V" pkg/ChanSampler-VST3.pkg
          pkgbuild --root pkg/clap --component-plist pkg/clap.plist --install-location "/Library/Audio/Plug-Ins/CLAP"       --identifier com.chansampler.clap --version "$V" pkg/ChanSampler-CLAP.pkg
          pkgbuild --root pkg/app  --component-plist pkg/app.plist  --install-location "/Applications"                       --identifier com.chansampler.app  --version "$V" pkg/ChanSampler-App.pkg
          cat LICENSE packaging/THIRD-PARTY-NOTICES.txt > pkg/res/LICENSE.txt   # the installer's license page
          sed "s/VERSION/$V/g" packaging/distribution.xml > pkg/distribution.xml
          productbuild --distribution pkg/distribution.xml --package-path pkg --resources pkg/res "dist/ChanSampler-$V-macOS.pkg"
          pkgutil --payload-files "dist/ChanSampler-$V-macOS.pkg" | head -8

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: ChanSampler-macOS
          path: dist/*.pkg

  linux:
    runs-on: ubuntu-22.04   # the oldest glibc we support (2.35), so the build runs on newer systems too
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev xvfb

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target ChanSampler_VST3 ChanSampler_CLAP ChanSampler_Standalone

      - name: Validate the VST3 (pluginval, strictest level)
        run: |
          curl -sL -o pluginval.zip $PLUGINVAL/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --skip-gui-tests --timeout-ms 900000 --validate "build/ChanSampler_artefacts/Release/VST3/Chan Sampler.vst3"

      - name: Package
        run: |
          set -e
          A=build/ChanSampler_artefacts/Release
          D="Chan Sampler (Linux)"
          mkdir "$D"
          cp -R "$A/VST3/Chan Sampler.vst3" "$A/CLAP/Chan Sampler.clap" "$A/Standalone/Chan Sampler" "$D/"
          V=$(sed -n 's/^project(ChanSampler VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          cp packaging/INSTALL-Linux.txt "$D/INSTALL.txt"
          cp LICENSE "$D/LICENSE.txt"
          cp packaging/THIRD-PARTY-NOTICES.txt "$D/"
          tar -czf "ChanSampler-$V-Linux.tar.gz" "$D"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: ChanSampler-Linux
          path: ChanSampler-*-Linux.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 during 2026-10/11
    permissions:
      contents: write   # only this job publishes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # This version's section of CHANGELOG.md
          tr -d '\r' < CHANGELOG.md | awk -v v="## $VERSION" '$0 == v {on = 1; next} /^## / {on = 0} on' > notes.md
          [ -s notes.md ] || echo "Chan Sampler $VERSION" > notes.md
          FILES=$(find artifacts -type f \( -name '*.exe' -o -name '*.pkg' -o -name '*.tar.gz' \))
          # Checksums, so downloads of these unsigned files can be checked
          (cd artifacts && find . -type f \( -name '*.exe' -o -name '*.pkg' -o -name '*.tar.gz' \) -exec sha256sum {} + | sed 's|  .*/|  |') > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" $FILES SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" --title "Chan Sampler ${VERSION}" --notes-file notes.md
