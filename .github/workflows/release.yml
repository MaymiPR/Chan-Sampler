# Builds Chan Sampler for Windows (VST3 + Standalone) and macOS (universal
# AU + VST3 + Standalone app), validates the plugins, and makes installers
# (Windows setup .exe, macOS .pkg) and zips. Run it by hand from the Actions
# tab to get them as downloadable artifacts, or push a version tag
# (git tag v1.0.0 && git push origin v1.0.0) to also publish them as a GitHub
# Release with that version's notes from CHANGELOG.md.
name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64   # the newest Visual Studio on the runner

      - name: Build
        run: cmake --build build --config Release --target ChanSampler_VST3 ChanSampler_Standalone --parallel

      - name: Validate the VST3 (pluginval, strictest level)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # pluginval is a GUI-subsystem program: wait for it and read its real exit code
          $plug = Resolve-Path "build/ChanSampler_artefacts/Release/VST3/Chan Sampler.vst3"
          $p = Start-Process -FilePath "pluginval/pluginval.exe" -NoNewWindow -Wait -PassThru `
                 -ArgumentList @("--strictness-level", "10", "--skip-gui-tests", "--timeout-ms", "900000", "--validate", "`"$plug`"")
          Write-Host "pluginval exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          $dist = "Chan Sampler (Windows)"
          New-Item -ItemType Directory $dist | Out-Null
          Copy-Item -Recurse "build/ChanSampler_artefacts/Release/VST3/Chan Sampler.vst3" $dist
          Copy-Item "build/ChanSampler_artefacts/Release/Standalone/Chan Sampler.exe" $dist
          Copy-Item "packaging/INSTALL-Windows.txt" "$dist/INSTALL.txt"
          Copy-Item "LICENSE" "$dist/LICENSE.txt"
          Compress-Archive -Path $dist -DestinationPath ChanSampler-Windows.zip

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(ChanSampler VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$version" "packaging\ChanSampler.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ChanSampler-Windows
          path: |
            ChanSampler-Windows.zip
            dist/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Configure (universal: Apple Silicon + Intel)"
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --target ChanSampler_AU ChanSampler_VST3 ChanSampler_Standalone -- -quiet

      - name: Check universal binaries and sign (ad hoc)
        run: |
          set -e
          A=build/ChanSampler_artefacts/Release
          lipo -info "$A/AU/Chan Sampler.component/Contents/MacOS/Chan Sampler"
          lipo -info "$A/VST3/Chan Sampler.vst3/Contents/MacOS/Chan Sampler"
          # An ad hoc signature (no Apple developer account) is enough for
          # Apple Silicon to load the plugin once the download quarantine is removed.
          for b in "$A/AU/Chan Sampler.component" "$A/VST3/Chan Sampler.vst3" "$A/Standalone/Chan Sampler.app"; do
            codesign --force --deep --sign - "$b"
          done

      - name: Validate the AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/ChanSampler_artefacts/Release/AU/Chan Sampler.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Csm1 Chsm

      - name: Validate the AU and VST3 (pluginval, strictest level)
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          P=pluginval.app/Contents/MacOS/pluginval
          $P --strictness-level 10 --skip-gui-tests --timeout-ms 900000 --validate ~/Library/Audio/Plug-Ins/Components/"Chan Sampler.component"
          $P --strictness-level 10 --skip-gui-tests --timeout-ms 900000 --validate "build/ChanSampler_artefacts/Release/VST3/Chan Sampler.vst3"

      - name: Package
        run: |
          A=build/ChanSampler_artefacts/Release
          D="Chan Sampler (macOS)"
          mkdir "$D"
          cp -R "$A/AU/Chan Sampler.component" "$A/VST3/Chan Sampler.vst3" "$A/Standalone/Chan Sampler.app" "$D/"
          cp packaging/INSTALL-macOS.txt "$D/INSTALL.txt"
          cp LICENSE "$D/LICENSE.txt"
          ditto -c -k --keepParent "$D" ChanSampler-macOS.zip

      - name: Installer (.pkg)
        run: |
          set -e
          V=$(sed -n 's/^project(ChanSampler VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          A=build/ChanSampler_artefacts/Release
          mkdir -p pkg/au pkg/vst3 pkg/app pkg/res dist
          cp -R "$A/AU/Chan Sampler.component" pkg/au/
          cp -R "$A/VST3/Chan Sampler.vst3" pkg/vst3/
          cp -R "$A/Standalone/Chan Sampler.app" pkg/app/
          # Install exactly where stated (pkgbuild would otherwise follow a copy
          # of the bundle found elsewhere on the disk).
          for c in au vst3 app; do
            pkgbuild --analyze --root pkg/$c pkg/$c.plist
            n=$(plutil -extract @count raw pkg/$c.plist 2>/dev/null || echo 1)
            for ((i = 0; i < n; i++)); do plutil -replace $i.BundleIsRelocatable -bool NO pkg/$c.plist; done
          done
          pkgbuild --root pkg/au   --component-plist pkg/au.plist   --install-location "/Library/Audio/Plug-Ins/Components" --identifier com.chansampler.au   --version "$V" pkg/ChanSampler-AU.pkg
          pkgbuild --root pkg/vst3 --component-plist pkg/vst3.plist --install-location "/Library/Audio/Plug-Ins/VST3"       --identifier com.chansampler.vst3 --version "$V" pkg/ChanSampler-VST3.pkg
          pkgbuild --root pkg/app  --component-plist pkg/app.plist  --install-location "/Applications"                       --identifier com.chansampler.app  --version "$V" pkg/ChanSampler-App.pkg
          cp LICENSE pkg/res/LICENSE.txt
          sed "s/VERSION/$V/g" packaging/distribution.xml > pkg/distribution.xml
          productbuild --distribution pkg/distribution.xml --package-path pkg --resources pkg/res "dist/ChanSampler-$V-macOS.pkg"
          pkgutil --payload-files "dist/ChanSampler-$V-macOS.pkg" | head -8

      - uses: actions/upload-artifact@v4
        with:
          name: ChanSampler-macOS
          path: |
            ChanSampler-macOS.zip
            dist/*.pkg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # This version's section of CHANGELOG.md (stored with CRLF line endings)
          tr -d '\r' < CHANGELOG.md | awk -v v="## $VERSION" '$0 == v {on = 1; next} /^## / {on = 0} on' > notes.md
          [ -s notes.md ] || echo "Chan Sampler $VERSION" > notes.md
          gh release create "${GITHUB_REF_NAME}" $(find artifacts -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.pkg' \)) \
            --repo "${GITHUB_REPOSITORY}" --title "Chan Sampler ${VERSION}" --notes-file notes.md
