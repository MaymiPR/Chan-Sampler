# Builds Chan Sampler and runs its tests: the engine tests (ChanSamplerTests)
# and the host test, which loads the built VST3 the way a DAW does
# (ChanSamplerHostTest). Linux, Windows and macOS on every push to main and
# on pull requests (the repository is public, so the runners cost nothing;
# they run side by side), and nothing when only docs or the null-test
# scripts change. release.yml also builds the universal macOS binaries and
# validates the AU at each release.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'nulltest/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'nulltest/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev xvfb

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHANSAMPLER_CLAP=OFF

      - name: Build
        run: cmake --build build --target ChanSamplerTests ChanSamplerUiTests ChanSamplerHostTest ChanSampler_VST3

      - name: Engine tests
        run: build/ChanSamplerTests_artefacts/Release/ChanSamplerTests
      - name: UI tests
        run: xvfb-run -a build/ChanSamplerUiTests_artefacts/Release/ChanSamplerUiTests nulltest/signals/sine.wav

      - name: Host test
        run: xvfb-run -a build/ChanSamplerHostTest_artefacts/Release/ChanSamplerHostTest "build/ChanSampler_artefacts/Release/VST3/Chan Sampler.vst3" nulltest/signals/sine.wav Tests/data/state-*.bin

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -B build -A x64 -DCHANSAMPLER_CLAP=OFF

      - name: Build
        run: cmake --build build --config Release --target ChanSamplerTests ChanSamplerUiTests ChanSamplerHostTest ChanSampler_VST3 --parallel

      - name: Engine tests
        run: build/ChanSamplerTests_artefacts/Release/ChanSamplerTests.exe
      - name: UI tests
        run: build/ChanSamplerUiTests_artefacts/Release/ChanSamplerUiTests.exe nulltest/signals/sine.wav

      - name: Host test
        shell: bash
        run: build/ChanSamplerHostTest_artefacts/Release/ChanSamplerHostTest.exe "build/ChanSampler_artefacts/Release/VST3/Chan Sampler.vst3" nulltest/signals/sine.wav Tests/data/state-*.bin

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCHANSAMPLER_CLAP=OFF

      - name: Build
        run: cmake --build build --target ChanSamplerTests ChanSamplerUiTests ChanSamplerHostTest ChanSampler_VST3 --parallel

      - name: Engine tests
        run: build/ChanSamplerTests_artefacts/Release/ChanSamplerTests
      - name: UI tests
        run: build/ChanSamplerUiTests_artefacts/Release/ChanSamplerUiTests nulltest/signals/sine.wav

      - name: Host test
        run: build/ChanSamplerHostTest_artefacts/Release/ChanSamplerHostTest "build/ChanSampler_artefacts/Release/VST3/Chan Sampler.vst3" nulltest/signals/sine.wav Tests/data/state-*.bin
