# CI: builds every Chan Sampler plug-in (VST3) with the tools, runs every plug-in's tests through ctest (the DSP,
# the processor, presets and state) and the render regression (scripts/render_regress.py: each plug-in's own renderer
# against the golden renders in tests/regress), and fails on any compiler, linker or CMake warning in the configure and
# build output (STANDARDS.md, zero warnings; the rule and the inputs of scripts/check.ps1 and check.sh).
# The build target is ci_targets: every plugin.cmake adds its VST3, tests and renderer to it (CMakeLists.txt), so a
# new plug-in needs no change here. The Windows job keeps the editor screenshots as an artifact for 14 days.
# Trigger: push to main and pull requests (not when only documents, docs/ or the null-test harnesses change), and by
# hand (Actions > CI > Run workflow).
# Runners: ubuntu-24.04, windows-latest, macos-15. Every job has a time limit: 60 minutes on Linux and macOS, 120 on
# Windows (a large suite builds longest there).
# Does not: build CLAP, AU or the installers, sign, or run pluginval and auval (release.yml does), or null against the
# original plug-ins (they are not on the runners). A private repository keeps this workflow disabled and runs
# scripts/check.ps1 or scripts/check.sh instead.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/nulltest/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/RELEASE_CHECKLIST.md'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/nulltest/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/RELEASE_CHECKLIST.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev xvfb

      - name: Configure
        shell: bash
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHANSAMPLER_TOOLS=ON -DCHANSAMPLER_CLAP=OFF 2>&1 | tee build.log

      - name: Build
        shell: bash
        run: cmake --build build --target ci_targets 2>&1 | tee -a build.log

      - name: Warnings (zero allowed)
        shell: bash
        run: |
          # the rule of scripts/check.ps1 and check.sh: compiler, linker and CMake warnings in the configure and build output
          if grep -E 'warning [A-Z]+[0-9]+|warning ?:|[0-9]+ warnings? generated|CMake (Deprecation )?Warning' build.log | grep -vE '::warning|hint:' > warnings.txt; then
            cat warnings.txt
            echo "$(wc -l < warnings.txt) warning line(s) in the configure and build output: zero allowed (STANDARDS.md)"
            exit 1
          fi
          echo "0 warnings"

      - name: Unit tests
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      - name: Render regression
        if: hashFiles('tests/regress/**/golden/*.f32') != ''   # until the first goldens are committed there is nothing to compare
        run: xvfb-run -a python3 scripts/render_regress.py --build build

  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        shell: bash
        run: cmake -B build -A x64 -DCHANSAMPLER_TOOLS=ON -DCHANSAMPLER_CLAP=OFF 2>&1 | tee build.log

      - name: Build
        shell: bash
        run: cmake --build build --config Release --target ci_targets --parallel 2>&1 | tee -a build.log

      - name: Warnings (zero allowed)
        shell: bash
        run: |
          # the rule of scripts/check.ps1 and check.sh: compiler, linker and CMake warnings in the configure and build output
          if grep -E 'warning [A-Z]+[0-9]+|warning ?:|[0-9]+ warnings? generated|CMake (Deprecation )?Warning' build.log | grep -vE '::warning|hint:' > warnings.txt; then
            cat warnings.txt
            echo "$(wc -l < warnings.txt) warning line(s) in the configure and build output: zero allowed (STANDARDS.md)"
            exit 1
          fi
          echo "0 warnings"

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Render regression
        if: hashFiles('tests/regress/**/golden/*.f32') != ''
        run: python scripts/render_regress.py --build build

      - name: Editor screenshots (artifact, not committed)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force screenshots | Out-Null
          foreach ($line in Get-Content packaging/plugins.txt) {
            if (-not $line.Trim() -or $line.StartsWith('#')) { continue }
            $t = $line.Split([char]0x7C)[0].Trim()
            # the class stem: the sixth column of packaging/plugins.txt, the one place it is read from
            $stem = $line.Split([char]0x7C)[5].Trim()
            $snap = Get-ChildItem "build/${stem}Snapshot_artefacts/Release/${stem}Snapshot.exe" -ErrorAction SilentlyContinue
            if ($snap) { & $snap.FullName "screenshots/$($t.ToLower()).png"; & $snap.FullName "screenshots/$($t.ToLower())@2x.png" --scale=2 }
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: hashFiles('screenshots/*.png') != ''
        with:
          name: screenshots
          path: screenshots/*.png
          retention-days: 14

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        # Ninja, as on Linux, runs one compile per core. The Makefile generator either sets no job limit (the
        # runner runs out of memory) or, given a count, warns that JUCE's nested helper build has no jobserver.
        shell: bash
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHANSAMPLER_TOOLS=ON -DCHANSAMPLER_CLAP=OFF 2>&1 | tee build.log

      - name: Build
        shell: bash
        run: cmake --build build --target ci_targets --parallel 2>&1 | tee -a build.log

      - name: Warnings (zero allowed)
        shell: bash
        run: |
          # the rule of scripts/check.ps1 and check.sh: compiler, linker and CMake warnings in the configure and build output
          if grep -E 'warning [A-Z]+[0-9]+|warning ?:|[0-9]+ warnings? generated|CMake (Deprecation )?Warning' build.log | grep -vE '::warning|hint:' > warnings.txt; then
            cat warnings.txt
            echo "$(wc -l < warnings.txt) warning line(s) in the configure and build output: zero allowed (STANDARDS.md)"
            exit 1
          fi
          echo "0 warnings"

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Render regression
        if: hashFiles('tests/regress/**/golden/*.f32') != ''
        run: python3 scripts/render_regress.py --build build
