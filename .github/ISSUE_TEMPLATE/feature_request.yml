name: Feature request
description: Suggest something new or a change.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature or change, and how you would use it.
    validations:
      required: true
  - type: dropdown
    id: fl
    attributes:
      label: Does FL Studio's Sampler have it?
      description: Chan Sampler follows FL's Sampler closely, so this helps decide how it should work.
      options:
        - "Yes, FL's Sampler does this"
        - "No, it would be new"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots of FL, examples, links.
