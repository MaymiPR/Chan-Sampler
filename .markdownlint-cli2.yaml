# markdownlint for the repository (the Lint workflow and the local check run it). The double-underscore placeholders
# read as underscore emphasis to the strong-style rule until setup fills them, so that rule is off; tables use the
# compact separator row, so the column-style rule is off; the README opens with a picture and badges.
config:
  default: true
  MD013:
    line_length: 200
    tables: false
    code_blocks: false
  MD024:
    siblings_only: true
  MD033: false
  MD041: false
  MD050: false
  MD060: false
